[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-analyst-agent"
version = "0.1.0"
description = "Production-grade Credit Analyst Agent: financial spreading, ratio engine, risk rating and credit memo generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "httpx>=0.27"]
pdf = ["pdfplumber>=0.11", "unstructured>=0.13"]
docx = ["python-docx>=1.1", "reportlab>=4.1"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
agent = ["langgraph>=0.2", "langchain>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
